<line x1="560" y1="90" x2="593" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="660" y1="140" x2="560" y2="198" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="715" y1="140" x2="715" y2="198" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="300" y="240" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">every attempt → append-only audit log; one-click revert</text>
