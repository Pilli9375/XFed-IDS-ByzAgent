<text x="275.0" y="94" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">train rows of that</text>
<text x="275.0" y="111" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">family (no val rows)</text>
<rect x="390" y="50" width="170" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="475.0" y="74" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">warm start</text>
<text x="475.0" y="94" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">from BASE model</text>
<text x="475.0" y="111" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">2 rounds × 3 epochs</text>
<rect x="595" y="40" width="190" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="690.0" y="64" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">gate</text>
