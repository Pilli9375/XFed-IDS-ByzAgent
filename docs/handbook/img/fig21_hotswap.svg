<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" style="font-family:Inter,'Segoe UI',Arial,sans-serif">
<rect width="800" height="280" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="10" y="50" width="150" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="85.0" y="74" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">analyst</text>
<text x="85.0" y="94" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">confirms family</text>
