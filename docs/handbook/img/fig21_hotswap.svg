<text x="545.0" y="244" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">swap + banner</text>
<rect x="640" y="200" width="150" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="715.0" y="224" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">reject</text>
<text x="715.0" y="244" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">keep incumbent</text>
<line x1="160" y1="90" x2="193" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
