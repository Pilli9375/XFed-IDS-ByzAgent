<text x="270" y="240" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">kept (most central)</text>
<circle cx="520" cy="90" r="9" fill="#d97706"/>
<circle cx="560" cy="230" r="9" fill="#d97706"/>
<circle cx="470" cy="300" r="9" fill="#dc2626"/>
