<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" style="font-family:Inter,'Segoe UI',Arial,sans-serif">
<rect width="800" height="372" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="400" y="24" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">Krum: score each update by distance to its nearest neighbours; keep the most central one</text>
