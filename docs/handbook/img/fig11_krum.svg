<line x1="270" y1="175" x2="285" y2="175" stroke="#d1d5db" stroke-width="1"/>
<line x1="270" y1="175" x2="240" y2="185" stroke="#d1d5db" stroke-width="1"/>
<line x1="270" y1="175" x2="300" y2="140" stroke="#d1d5db" stroke-width="1"/>
<line x1="270" y1="175" x2="270" y2="205" stroke="#d1d5db" stroke-width="1"/>
<line x1="270" y1="175" x2="230" y2="160" stroke="#d1d5db" stroke-width="1"/>
<circle cx="260" cy="150" r="9" fill="#2563eb"/>
<circle cx="285" cy="175" r="9" fill="#2563eb"/>
<circle cx="240" cy="185" r="9" fill="#2563eb"/>
<circle cx="300" cy="140" r="9" fill="#2563eb"/>
<circle cx="270" cy="205" r="9" fill="#2563eb"/>
<circle cx="230" cy="160" r="9" fill="#2563eb"/>
