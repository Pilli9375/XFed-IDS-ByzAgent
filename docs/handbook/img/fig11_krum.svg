<text x="634" y="203" font-size="11" fill="#1f2937" text-anchor="start" font-weight="400">attacker</text>
<text x="400" y="360" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Under non-IID data, unusual honest orgs sit as far out as attackers. Schematic, not data.</text>
