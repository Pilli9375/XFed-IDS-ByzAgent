<text x="560" y="70" font-size="11" fill="#d97706" text-anchor="middle" font-weight="400">honest but unusual traffic mix</text>
<text x="470" y="330" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="400">attacker</text>
<circle cx="620" cy="150" r="7" fill="#2563eb"/>
<text x="634" y="155" font-size="11" fill="#1f2937" text-anchor="start" font-weight="400">typical honest org</text>
