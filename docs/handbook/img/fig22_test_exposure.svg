<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" style="font-family:Inter,'Segoe UI',Arial,sans-serif">
<rect width="800" height="370" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="20" y="20" width="160" height="330" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
