<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" style="font-family:Inter,'Segoe UI',Arial,sans-serif">
<rect width="800" height="350" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="30" y="40" width="200" height="90" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="130.0" y="64" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">10 orgs train</text>
<text x="130.0" y="84" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">(3 poisoned in attack runs)</text>
<rect x="300" y="40" width="200" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="400.0" y="64" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">5 statistics / org</text>
<text x="400.0" y="84" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">update_norm · cosines</text>
<text x="400.0" y="101" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">train_loss · val_accuracy</text>
<rect x="570" y="40" width="200" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="670.0" y="64" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">ByzAgent (LLM)</text>
<text x="670.0" y="84" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">llama3.1:8b, local</text>
<text x="670.0" y="101" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">temperature 0.2</text>
<rect x="570" y="200" width="200" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="670.0" y="224" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">JSON decisions</text>
<text x="670.0" y="244" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">trust / downweight / quarantine</text>
<text x="670.0" y="261" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">+ rationale per org</text>
<rect x="300" y="200" width="200" height="90" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="400.0" y="224" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">weights</text>
<text x="400.0" y="244" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">trust 1× · downweight 0.3×</text>
<text x="400.0" y="261" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">quarantine 0×</text>
<rect x="30" y="200" width="200" height="90" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="130.0" y="224" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">audit (offline)</text>
<text x="130.0" y="244" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">citation accuracy</text>
<text x="130.0" y="261" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">decision correlation, stability</text>
<line x1="230" y1="85" x2="298" y2="85" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="500" y1="85" x2="568" y2="85" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="670" y1="130" x2="670" y2="198" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="568" y1="245" x2="502" y2="245" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="300" y1="245" x2="232" y2="245" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4,3"/>
<text x="400" y="320" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="400">Never in the prompt: true attacker identity, oracle f, which statistic is strongest.</text>
<text x="400" y="338" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Reported numbers are replays of logged statistics, not a live run where decisions drove training.</text>
