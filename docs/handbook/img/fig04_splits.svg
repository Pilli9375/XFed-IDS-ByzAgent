<rect x="40" y="207" width="360" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="220" y="237" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="400">training rows → 10 silos (Dirichlet α)</text>
<rect x="420" y="207" width="140" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="490" y="229" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">validation 10%</text>
<text x="490" y="246" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">143,513 rows</text>
<text x="400" y="290" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">Both splits are group-aware: identical feature vectors never straddle a boundary.</text>
<text x="400" y="308" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">Every model / round / setting choice is made on validation.</text>
