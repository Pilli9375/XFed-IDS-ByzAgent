<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" style="font-family:Inter,'Segoe UI',Arial,sans-serif">
<rect width="800" height="320" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="40" y="40" width="720" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="400" y="68" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">1,913,502 cleaned flows</text>
<line x1="250" y1="86" x2="250" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="640" y1="86" x2="640" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="120" width="520" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="300" y="150" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">train pool 1,435,126 (75%)</text>
<rect x="580" y="120" width="180" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="670" y="142" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">test 478,376 (25%)</text>
<text x="670" y="160" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">scored once per checkpoint</text>
<line x1="200" y1="170" x2="200" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
