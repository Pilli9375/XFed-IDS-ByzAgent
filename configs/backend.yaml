# configs/backend.yaml
# Configuration for the Phase 2 dashboard backend (backend/*.py).
# Every path, tag, and tolerance the backend depends on lives here -- nothing
# is hardcoded in backend/*.py. Backend code is read-only against results/,
# docs/, and federated/: entries below only ever point INTO them.

paths:
  train_pool: data/processed/train_pool.parquet
  val_mask: data/processed/val_mask.parquet
  model_config: configs/model.yaml
  data_config: configs/data.yaml
  best_rounds_manifest: results/inspection/best_rounds_manifest.json
  federated_results_dir: results/federated
  shap_dir: results/shap
  # Resolved per-request as shap_dir/<tag>/<shap_filename>.
  shap_filename: global_shap.npz
  # Sidecar built OFFLINE by tools/build_shap_eval_sidecar.py (raw_values,
  # base_values for the same 14 fixed eval rows) -- read at startup exactly
  # like shap_filename above. Never built or refreshed by the backend
  # itself; if this file is missing for the configured tag, run that script
  # by hand first.
  shap_sidecar_filename: eval_rows_sidecar.npz
  # Larger SHAP pool for streamed simulator alerts, built OFFLINE by
  # tools/build_shap_streamed_pool.py (500 rows, stratified across the 7
  # headline families, each with an explicit sample_id = its row position
  # in test_global.parquet). Read at startup exactly like the two above.
  # backend/simulator.py also reads this file's sample_id array directly
  # (not through the API) to know which streamed rows to tag.
  shap_streamed_pool_filename: streamed_pool.npz
  # Validation-row SHAP pool for the demo simulator, built OFFLINE by
  # tools/build_shap_val_pool.py from configs/val_shap_pool.yaml (500 seeded
  # validation rows, all 9 families). sample_id = row position in
  # train_pool.parquet, so /shap serves it only under ?source=val. Read at
  # startup like the pools above; the simulator replays it when
  # simulator.source_split is val_shap_pool.
  shap_val_pool_filename: val_pool.npz
  agreement_metrics: results/inspection/agreement_metrics.csv
  per_silo_agreement: results/inspection/per_silo_agreement.csv
  round_wise_agreement: results/inspection/round_wise_agreement.csv
  centralized_instability_floor: results/inspection/centralized_instability_floor.csv
  parity_monitor: results/inspection/parity_monitor.csv
  # Demo traffic source for backend/simulator.py ONLY -- a demo-serving read,
  # not an evaluation read. load_and_verify() must never touch this path;
  # see the verify: block's own comment for why the test set is otherwise
  # off-limits.
  test_global: data/processed/test_global.parquet
  # ByzAgent trust panel (GET /trust). attacks_dir holds one subdirectory per
  # attack condition, each with attack_config.json (TRUE malicious_silos --
  # never hardcoded) and flip_log.csv. decision_variance_phase3 /
  # decision_variance_phase4 are precomputed structured summaries (already
  # computed n_stable/stability_rate per condition -- not raw LLM logs, and
  # not re-derived here) backing results/agents/PHASE3_SUMMARY.md and
  # PHASE4_SUMMARY.md's published decision-variance tables.
  attacks_dir: results/attacks
  decision_variance_phase3: results/inspection/phase3_gate_analysis_a0.5_s42.json
  decision_variance_phase4: results/inspection/phase4_gate_analysis_a0.5_s42.json

  # GET /federation -- serves ALL 9 (alpha, seed) configs, unlike every
  # other endpoint in this file. best_rounds_manifest above is reused for
  # manifest_summaries; these are the additional sources.
  silo_sizes: results/inspection/silo_sizes.csv

  # GET /faithfulness -- single config only (alpha=0.5, seed=42), per
  # app_lib/loaders.py's FAITHFULNESS_CONFIG_LABEL. Per-step curve data
  # does not exist (tools/deletion_curve.py / insertion_curve.py wrote only
  # the final AUC + a PNG) -- do not regenerate or modify these.
  deletion_auc: results/inspection/deletion_auc.csv
  insertion_auc: results/inspection/insertion_auc.csv
  figures_dir: results/figures

  # GET /explain/{sample_id} -- Step 8, LLM explanation layer. Pregenerated
  # OFFLINE by tools/build_explanations.py (one sentence per row of the
  # SAME 514-row set /shap already serves: 14 curated + 500 streamed).
  # Read at startup exactly like the SHAP artifacts above; the backend
  # never calls an LLM itself. Resolved per-request as
  # explanations_dir/<tag>/explanations_filename.
  explanations_dir: results/explanations
  explanations_filename: sentences.json
  # Same generator (--pool val --seed 6006), same model and prompt, for the
  # 500 rows of shap_val_pool_filename; served under /explain/{id}?source=val.
  explanations_val_filename: val_sentences.json

  # Dashboard v2 (GET /figures, /accuracy, /agreement/summary, and the
  # baselines/fidelity blocks added to GET /trust). Every file is read once
  # at startup by backend/figures.py; nothing is recomputed per request.
  prereg_test_result: results/federated_methods/test_once/result.json
  prereg_selection: results/federated_methods/selection.json
  inference_speed_summary: results/efficiency/inference_speed_summary.json
  communication: results/efficiency/communication.json
  update_compression: results/efficiency/update_compression.json
  agent_prescreen_replay: results/efficiency/agent_prescreen_replay.json
  federated_headline: results/aggregated/federated_headline.csv
  federated_per_family: results/aggregated/federated_per_family.csv
  centralized_headline: results/aggregated/centralized_headline.csv
  centralized_per_family: results/aggregated/centralized_per_family.csv
  xgboost_headline: results/aggregated/xgboost_headline.csv
  xgboost_per_family: results/aggregated/xgboost_per_family.csv
  phase4_reasoning_audit: results/inspection/phase4_diagnostic_reasoning_audit.json
  trend_claim_handcheck: results/inspection/multiseed_trend_claim_handcheck_verdicts.json

dashboard:
  # GET /figures. Keys name entries inside the files above, never values.
  figures:
    headline_alpha: "0.5"
    serving_variant: ort_fp32
    reference_variant: torch_eager
    dropped_inference_variant: ort_int8_dynamic
    upload_scheme: fp16
    upload_scheme_alt: int8
    # Delta statistic reported for compressed uploads (update_compression.json).
    upload_delta_stat: best_by_val
  # GET /agreement/summary: the alpha=0.1 vs floor comparison. Same method,
  # seed and resample count as tools/chat04_closeout.py, which first printed
  # these intervals; the backend imports that script's function, it does
  # not reimplement it.
  agreement_summary:
    ci_alpha: "0.1"
    ci_metric: jaccard_at_10
    cluster_cols: [seed, silo]
    n_boot: 10000
    rng_seed: 0
    chance_k: 10
  # Phase 2 classical defences (GET /trust -> baselines). seed 42, the
  # defence is told the true f (oracle). Malicious silos come from each
  # attack's attack_config.json, never from this file.
  trust_baselines:
    seed: 42
    clean_reference_run: fedavg_a0.5_s42
    clean_control_runs:
      - {label: Krum, run: krumclassical_f3_a0.5_s42}
      - {label: Multi-Krum, run: multikrum_f3_a0.5_s42}
      - {label: Trimmed mean, run: trimmedmean_f3_a0.5_s42}
    multikrum_attack_runs:
      - {run: multikrum_f3_a0.5_s42_poisoned_f3_sudden_silos0-3-5, attack: a0.5_s42_f3_sudden_silos0-3-5}
      - {run: multikrum_f2_a0.5_s42_poisoned_f2_sudden_silos0-3, attack: a0.5_s42_f2_sudden_silos0-3}

model:
  # Which (algo, alpha, seed) run this backend serves. Must match a "tag"
  # entry in best_rounds_manifest.json.
  tag: fedavg_a0.5_s42
  device: cpu

verify:
  # Boot-time reproduction check -- see backend/model_loader.py:load_and_verify().
  # Recomputed on the FULL validation split ONLY (train_pool.parquet rows where
  # val_mask.is_val is true). Never reads test_global.parquet: the test set is
  # spent and a per-boot check must not touch it.
  #
  # Compared against results/federated/<tag>/round_history.json, the entry for
  # best_round, field `metric`, at `tolerance`. Measured 0.0 diff on both CPU
  # and CUDA for fedavg_a0.5_s42 round 18 -- the tolerance is deliberately
  # tight. Do not widen it to silence a failure; a mismatch here means the
  # serving path (scaler scope, feature order, architecture) has drifted from
  # whatever produced the reported numbers, and that must be root-caused, not
  # papered over.
  split: val
  source: round_history
  metric: val_macro_f1_headline
  tolerance: 1.0e-5

alerts:
  # In-memory ring buffer in backend/main.py, newest-first via GET /alerts.
  # Every POST /predict call appends one entry (see main.py's PredictRequest
  # true_family field) -- not just simulator-originated ones. Lost on
  # restart; nothing here is persisted to results/.
  buffer_size: 200

simulator:
  # backend/simulator.py is a separate process/task: it talks to the API
  # over HTTP like any other client, so the backend serves normally whether
  # or not this is running.
  backend_url: http://127.0.0.1:8000
  rate_per_second: 1.0
  # Which split the replayed rows come from:
  #   val_shap_pool -- exactly the 500 validation rows in
  #           results/shap/<tag>/<shap_val_pool_filename>, replayed in stored
  #           order (no shuffle), each with precomputed SHAP (default).
  #   val  -- train_pool.parquet rows where val_mask.is_val is true, shuffled
  #           once with shuffle_seed; no SHAP for any of them.
  #   test -- test_global.parquet. Refused unless the served model's
  #           checkpoint state-dict sha256 (the hash the hot-swap audit log
  #           records) is listed in test_split_checkpoint_allowlist below, and
  #           no hot-swap is active. Reason: a candidate model that has not
  #           been sealed (e.g. a hot-swapped one) must never show per-alert
  #           correctness on test rows.
  # Rows of the full val split carry no precomputed SHAP; only the
  # val_shap_pool sample does.
  source_split: val_shap_pool
  # State-dict sha256 values of checkpoints that may be replayed on the test
  # split. Empty on purpose: add an entry only for a sealed checkpoint.
  test_split_checkpoint_allowlist: []
  # true = restart from row 0 (of the SHUFFLED order below) after the last
  # row of the chosen split so the demo feed never just stops.
  loop: true
  # source_split val/test only (val_shap_pool keeps its stored order).
  # Row order is shuffled ONCE at simulator startup with this seed (see
  # _load_demo_rows in backend/simulator.py), then replayed sequentially and
  # looped -- not resampled per tick. Sequential file order is 100% Benign
  # for the first ~2,000 rows (CICIDS2017's day-file chronology), which
  # made the un-shuffled demo show nothing but Benign for the first ~30
  # minutes at 1/sec. A fixed seed keeps a rehearsed demo run reproducible.
  # Deliberately NOT stratified or curated -- the natural class mix (heavily
  # Benign, per real network traffic) is the honest one to show.
  shuffle_seed: 42

limits:
  # GET /limits (Limits view). Text is read from these files at startup and
  # rendered as written: the canonical claims section, the test-set
  # paragraphs, and verbatim excerpts for two engineering notes.
  claims_file: PROJECT_INSTRUCTIONS.md
  section: Findings that limit what can be claimed
  test_set_marker: "**Test-set use.**"
  excerpts:
    - {title: "CPU, not GPU, for this model", file: configs/hotswap.yaml, marker: "Model itself is"}
    - {title: "Family-level conflict detection", file: data/README.md, marker: "Conflicts are evaluated"}
