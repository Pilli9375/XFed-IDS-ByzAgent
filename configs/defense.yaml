# configs/defense.yaml
# ByzAgent -- Contribution B, Phase 2. Robust-aggregation baseline selection
# for federated/xfed_federated/server_app.py. Deliberately a SEPARATE file
# from configs/model.yaml and configs/attack.yaml: Contribution B stays
# visibly distinct from Contribution A (plain FedAvg), same convention
# attack.yaml already established.
#
# Consumed by server_app.py's main(). RESTING STATE below (strategy:
# fedavg, num_malicious_nodes: 0) has zero effect on the existing clean
# FedAvg pipeline -- every locked Contribution A / Phase 0 / Phase 1 result
# is reproducible byte-for-byte regardless of this file's contents when left
# at this resting state.

defense:
  # fedavg      -- plain FedAvg (Contribution A / Phase 0 / Phase 1 baseline).
  # multikrum   -- PRIMARY Krum-family headline comparison (01_Planning,
  #                Phase 2 go-ahead). num_nodes_to_select = n_silos -
  #                num_malicious_nodes, computed at runtime in server_app.py
  #                -- not set here.
  # krum        -- classical Krum (selects exactly 1 client's raw update).
  #                SECONDARY SANITY CHECK ONLY -- never plotted/reported as
  #                a standalone baseline comparable to ByzAgent or to
  #                multikrum. See LoggingKrum's docstring in server_app.py.
  # trimmed_mean -- coordinate-wise trimmed mean. beta = num_malicious_nodes
  #                / n_silos, computed at runtime -- NOT the library default
  #                of 0.2, and not set here.
  # byzagent    -- ByzAgent (Phase 3): LLM-based per-round trust decisions
  #                over Phase 1's 5 behavioral stats. Configured via the
  #                SEPARATE configs/agent.yaml (model, thresholds, etc.),
  #                same split as multikrum/trimmed_mean's params living
  #                here while their strategy choice lives here too. Does
  #                NOT read num_malicious_nodes below -- no oracle f, ever
  #                (see configs/agent.yaml's closing note). Leave
  #                num_malicious_nodes at 0 for byzagent runs, same
  #                convention as fedavg.
  strategy: fedavg

  # ORACLE f fed to multikrum/krum/trimmed_mean (01_Planning, Phase 2
  # go-ahead): the TRUE f from configs/attack.yaml's `attack.f` for the
  # condition under test, not inferred or estimated. This is a deliberate,
  # documented advantage given to these baselines -- ByzAgent (Phase 3+)
  # will not be given this number, it infers trust from behavior instead.
  # Disclose explicitly in PHASE2_SUMMARY.md and wherever results are first
  # shown; do not let this read as an oversight.
  #
  # Set this to match configs/attack.yaml's attack.f for the run under test:
  #   f=3 {0,3,5} condition -> num_malicious_nodes: 3
  #   f=2 {0,3} condition   -> num_malicious_nodes: 2
  #   clean / no-attack runs, or strategy: fedavg -> 0 (unused by fedavg,
  #   left at 0 so a stale nonzero value can never silently leak into a
  #   clean-baseline run's tag/logs).
  num_malicious_nodes: 0
